name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - '**'
    paths:
      - '.github/workflows/release.yaml'
      - '.github/workflows/check.yaml'
      - 'scripts/compile.ts'
      - 'scripts/checksum.ts'
      - 'scripts/platforms.ts'
      - 'scripts/release.ts'
      - 'scripts/smoke.ts'
      - 'docs/installation.md'
      - 'LICENSE*'
      - 'tests/compile.test.ts'
      - 'tests/release.test.ts'
      - 'package.json'
      - 'bun.lockb'
      - 'bump.config.ts'
      - '.bun-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  metadata:
    name: 校验版本与发布目标
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: 校验标签并生成产物清单
        id: metadata
        run: bun scripts/release.ts metadata
      - name: 检查发布状态
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$state" != 'true' ]; then
              echo '该标签已经公开发布，请使用新版本标签。'
              exit 1
            fi
          fi

  checks:
    needs: metadata
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/check.yaml

  build:
    name: 验收 ${{ matrix.name }}
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle
      RELEASE_BINARY: ${{ matrix.binary }}
      RELEASE_PLATFORM: ${{ matrix.name }}
      BUN_TARGET: ${{ matrix.target }}
    steps:
      - name: 检出待验收提交
        uses: actions/checkout@v5
      - name: 安装固定版本 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 安装固定版本 Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14'
      - name: 缓存隔离的 Maven 仓库
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/java-run-maven-repository
          key: ${{ runner.os }}-${{ runner.arch }}-release-maven-${{ hashFiles('tests/fixtures/**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-release-maven-
      - name: 按锁文件安装依赖
        run: bun install --frozen-lockfile
      - name: 构建待发布二进制
        shell: bash
        run: |
          bun run compile --target="$BUN_TARGET" --outfile="dist/$RELEASE_BINARY"
      - name: JDK 21 完整运行验收
        shell: bash
        env:
          JAVA_RUN_MAVEN_REPOSITORY: ${{ runner.temp }}/java-run-maven-repository
          JAVA_RUN_GRADLE_HOME: ${{ env.GRADLE_USER_HOME }}
        run: bun scripts/smoke.ts --cli="dist/$RELEASE_BINARY" --suite=full
      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: 打包与 JDK 17 解压产物验收
        shell: bash
        env:
          JAVA_RUN_MAVEN_REPOSITORY: ${{ runner.temp }}/java-run-maven-repository
          JAVA_RUN_GRADLE_HOME: ${{ env.GRADLE_USER_HOME }}
        run: bun scripts/release.ts package "$RELEASE_PLATFORM"
      - name: 上传已验收压缩包
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          overwrite: true

  artifacts:
    name: 汇总与校验已验收产物
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: 汇总构建产物
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: 校验五种产物并生成 SHA-256
        run: bun scripts/release.ts checksums
      - name: 核对文件校验和
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: 生成发布说明预览
        run: |
          bun scripts/release.ts notes > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: 保存已校验产物
        uses: actions/upload-artifact@v6
        with:
          name: release-with-checksums
          path: dist/*
          if-no-files-found: error
          overwrite: true

  release:
    name: 发布完整标签产物
    needs: [metadata, checks, artifacts]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@v7
        with:
          name: release-with-checksums
          path: dist
      - name: 核对待上传文件
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: 生成下载与安装说明
        run: |
          bun scripts/release.ts notes > release-notes.md
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq .body >> release-notes.md
      - name: 创建或恢复未公开草稿
        run: |
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$state" != 'true' ]; then
              echo '该标签已经公开发布，请使用新版本标签。'
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "java-run $RELEASE_TAG" \
              --notes-file release-notes.md --prerelease="$RELEASE_PRERELEASE"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --notes-file release-notes.md --title "java-run $RELEASE_TAG" \
              --prerelease="$RELEASE_PRERELEASE"
          fi
      - name: 上传完整资产并核对草稿
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name]' \
            | bun scripts/release.ts verify-assets
      - name: 公开已验收版本
        run: |
          if [ "$RELEASE_PRERELEASE" = 'true' ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=true --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false
          fi
