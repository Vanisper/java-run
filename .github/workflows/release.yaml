name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/check.yaml

  build:
    name: 构建 ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64-baseline
            target: bun-windows-x64-baseline
            extension: .exe
          - name: linux-x64-baseline
            target: bun-linux-x64-baseline
            extension: ''
          - name: linux-arm64
            target: bun-linux-arm64
            extension: ''
          - name: darwin-arm64
            target: bun-darwin-arm64
            extension: ''
          - name: darwin-x64
            target: bun-darwin-x64
            extension: ''
    steps:
      - name: 检出事件对应的标签
        uses: actions/checkout@v4
      - name: 安装固定版本 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: 按锁文件安装依赖
        run: bun install --frozen-lockfile
      - name: 交叉编译
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PLATFORM_NAME: ${{ matrix.name }}
          BUN_TARGET: ${{ matrix.target }}
          FILE_EXTENSION: ${{ matrix.extension }}
        run: |
          bun build src/cli.ts --compile --minify \
            --target "$BUN_TARGET" \
            --outfile "dist/java-run-${PLATFORM_NAME}-${RELEASE_TAG}${FILE_EXTENSION}"
      - name: 上传单个平台产物
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 校验并发布标签产物
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 汇总构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - name: 生成并核对 SHA-256
        working-directory: dist
        run: |
          sha256sum java-run-* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: 保存已校验产物
        uses: actions/upload-artifact@v4
        with:
          name: release-with-checksums
          path: dist/*
          if-no-files-found: error
      - name: 发布当前事件的标签
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
